[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "xtream-codes-buffer-proxy"
version = "0.1.0"
description = "Buffering proxy for an Xtream Codes IPTV provider"
readme = "README.md"
requires-python = ">=3.12,<3.14"
license = "MIT"
dependencies = [
    "aiohttp>=3.10,<4",
]

[project.scripts]
xcbuffer = "xcbuffer.app:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
    "pytest-aiohttp>=1.1,<2",
    "ruff>=0.11,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/xcbuffer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = ["--strict-config", "--strict-markers"]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
ignore = ["ASYNC109", "ASYNC110"]
